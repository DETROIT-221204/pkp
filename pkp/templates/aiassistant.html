<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DhanGyan - AI Assistant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<!--  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">-->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --primary-bg: #0a0a1a;
      --secondary-bg: #1a1a2e;
      --accent: #9c27b0;
      --accent-hover: #e91e63;
      --text: #e0e0e0;
    }

    body {
      background: var(--primary-bg);
      color: var(--text);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* Navbar Styles */
    .navbar {
      background: rgba(26, 26, 46, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(156, 39, 176, 0.3);
      padding: 1rem 2rem;
    }

    .navbar-brand {
      font-weight: 700;
      font-size: 1.8rem;
      background: linear-gradient(45deg, #9c27b0, #e91e63);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .nav-link {
      position: relative;
      color: var(--text) !important;
      margin: 0 10px;
      padding: 8px 16px !important;
      border-radius: 20px;
      transition: all 0.3s ease;
    }

    .nav-link:hover, .nav-link.active {
      background: linear-gradient(45deg, #9c27b0, #e91e63);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(156, 39, 176, 0.4);
    }

    /* Glow Button */
    .btn-glow {
      position: relative;
      padding: 10px 20px;
      background: transparent;
      color: white;
      border: none;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      font-weight: 600;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .btn-glow::before {
      content: '';
      position: absolute;
      inset: 0;
      margin: auto;
      width: calc(100% + 8px);
      height: calc(100% + 2px);
      border-radius: 10px;
      background: linear-gradient(-45deg, #e81cff 0%, #40c9ff 100%);
      z-index: -2;
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-glow::after {
      content: "";
      position: absolute;
      inset: 2px;
      background: var(--primary-bg);
      border-radius: 6px;
      z-index: -1;
    }

    .btn-glow:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    .btn-glow:hover::before {
      transform: rotate(180deg);
      filter: blur(5px);
    }

    /* Chat Box */
    .chat-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0;
  }

    .chat-box {
    width: 100%;       /* ✅ Full width */
    height: calc(100vh - 70px); /* ✅ Full height minus navbar */
    background-color: var(--secondary-bg);
    border-radius: 0;  /* ✅ Remove rounded corners for full width look */
    box-shadow: none;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

    .chat-messages {
    flex-grow: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

    .message {
      margin-bottom: 10px;
      padding: 10px 15px;
      border-radius: 15px;
      max-width: 75%;
      word-wrap: break-word;
      font-size: 0.95rem;
    }

    .user-message {
      background: linear-gradient(45deg, #9c27b0, #e91e63);
      color: white;
      align-self: flex-end;
    }

    .bot-message {
      background-color: #2e2e46;
      color: var(--text);
      align-self: flex-start;
    }

    .chat-input {
    display: flex;
    padding: 15px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(10, 10, 26, 0.95);
  }

    .chat-input input {
      flex-grow: 1;
      padding: 10px;
      border: none;
      border-radius: 20px;
      outline: none;
      background: #1a1a2e;
      color: var(--text);
    }

    .chat-input button {
      margin-left: 10px;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="{{url_for('search')}}">DhanGyan</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navItems" aria-controls="navItems" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navItems">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item"><a class="nav-link" href="{{url_for('search')}}"><i class="fas fa-chart-line me-2"></i>Stock</a></li>
        <li class="nav-item"><a class="nav-link" href="{{url_for('gold')}}"><i class="fas fa-coins me-2"></i>Gold</a></li>
        <li class="nav-item"><a class="nav-link" href="{{url_for('real_estate')}}"><i class="fas fa-home me-2"></i>Real Estate</a></li>
        <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-bitcoin me-2"></i>Crypto</a></li>
        <li class="nav-item"><a class="nav-link" href="{{url_for('Assistant')}}"><i class="fas fa-robot me-2"></i>AI Assistant</a></li>
        <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
          <a href="{{url_for('compare_assets')}}" class="btn-glow"><i class="fas fa-balance-scale me-2"></i>Compare</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Chat Container -->
<div class="chat-container">
  <div class="chat-box">
    <div class="chat-messages" id="chat-messages">
      <div class="message bot-message">Hello! How can I help you today?</div>
    </div>
    <div class="chat-input">
      <input type="text" id="user-input" placeholder="Type a message..." autofocus>
      <button class="btn btn-glow" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script>
  async function sendMessage() {
    const userInput = document.getElementById("user-input");
    const message = userInput.value.trim();
    if (message === "") return;

    const messagesContainer = document.getElementById("chat-messages");

    // User message
    const userMessageDiv = document.createElement("div");
    userMessageDiv.className = "message user-message";
    userMessageDiv.textContent = message;
    messagesContainer.appendChild(userMessageDiv);
    userInput.value = "";
    messagesContainer.scrollTop = messagesContainer.scrollHeight;

    try {
      const response = await fetch("/api", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });
      const data = await response.json();
      const botMessageDiv = document.createElement("div");
      botMessageDiv.className = "message bot-message";
      botMessageDiv.innerHTML = marked.parse(data.reply); // render Markdown
      messagesContainer.appendChild(botMessageDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    } catch (error) {
      const errorMessageDiv = document.createElement("div");
      errorMessageDiv.className = "message bot-message";
      errorMessageDiv.textContent = "Error: Could not connect to the server.";
      messagesContainer.appendChild(errorMessageDiv);
    }
  }

  document.getElementById("user-input").addEventListener("keyup", function(event) {
    if (event.key === "Enter") sendMessage();
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
